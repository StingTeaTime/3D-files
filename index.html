<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tent Configurator</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #1a1a2e; }
    #ui {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(0,0,0,0.7); padding: 16px; border-radius: 10px;
      color: white; min-width: 160px;
    }
    #ui h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; opacity: 0.6; }
    .color-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      margin: 6px 0; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; background: transparent; color: white;
      cursor: pointer; font-size: 13px;
    }
    .color-btn:hover { background: rgba(255,255,255,0.15); }
    .color-btn.active { border-color: white; background: rgba(255,255,255,0.2); }

      .color-btn2 {
      display: flex; align-items: center; gap: 10px; width: 100%;
      margin: 6px 0; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; background: transparent; color: white;
      cursor: pointer; font-size: 13px;
    }
    .color-btn2:hover { background: rgba(255,255,255,0.15); }
    .color-btn2.active { border-color: white; background: rgba(255,255,255,0.2); }
    .swatch { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }

    
    #status {
      margin-top: 12px; font-size: 11px; opacity: 0.5;
      border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;
    }
    #version {
      position: absolute; bottom: 10px; right: 10px;
      color: white; font-size: 11px; opacity: 0.3;
    }
  </style>
</head>
<body>

<div id="ui">
  <h3>Cord Color</h3>
  <button class="color-btn" data-color="#228B22"><span class="swatch" style="background:#228B22"></span>Forest Green</button>
  <button class="color-btn" data-color="#4169E1"><span class="swatch" style="background:#4169E1"></span>Royal Blue</button>
  <button class="color-btn" data-color="#CC2200"><span class="swatch" style="background:#CC2200"></span>Red</button>
  <button class="color-btn" data-color="#E8A020"><span class="swatch" style="background:#E8A020"></span>Orange</button>
  <button class="color-btn" data-color="#111111"><span class="swatch" style="background:#333333"></span>Black</button>

  <h3>bottom Color</h3>
  <button class="color-btn2" data-color="#7F00FF"><span class="swatch" style="background:#7F00FF"></span>Violet</button>
  <button class="color-btn2" data-color="#111111"><span class="swatch" style="background:#333333"></span>Black</button>
  
  <div id="status">Initializing...</div>
</div>

<div id="version">v9</div>   //version

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const status = document.getElementById('status');
status.textContent = 'Script started...';

// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(2, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// --- Lighting ---
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 10, 5);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8888ff, 0x334422, 0.8));

// --- Load GLB ---
let CordMeshes = [];
let BotbagMeshes = [];

status.textContent = 'Loading GLB...';

const loader = new GLTFLoader();
loader.load(
  './Bike.glb',
  (gltf) => {
    scene.add(gltf.scene);

    // Log all object names so we can debug
    console.log('--- All objects in GLB ---');
 gltf.scene.traverse((child) => {
      console.log(child.type + ' : ' + child.name);

      if (child.name === 'Cord') {
        if (child.isMesh) CordMeshes.push(child);
        else child.traverse(c => { if (c.isMesh) CordMeshes.push(c); });
      }

      if (child.name === 'Botbag') {
        if (child.isMesh) BotbagMeshes.push(child);
        else child.traverse(c => { if (c.isMesh) BotbagMeshes.push(c); });
      }
    });

    if (CordMeshes.length > 0) status.textContent = 'Ready ✓ — pick a color!';
    else status.textContent = '⚠ Cord not found — check console';

    if (BotbagMeshes.length > 0) console.log('Botbag ready');
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      status.textContent = 'Loading GLB: ' + pct + '%';
    }
  },
  (err) => {
    status.textContent = '✗ GLB error — check console';
    console.error('GLB load error:', err);
  }
);

// --- Color buttons ---
document.querySelectorAll('.color-btn').forEach((btn) => {
  btn.addEventListener('click', () => {

    document.querySelectorAll('.color-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    CordMeshes.forEach((mesh) => {
      if (!mesh.userData.cloned) {
        mesh.material = mesh.material.clone();
        mesh.userData.cloned = true;
      }

      mesh.material.color.set(btn.dataset.color);
    });
  });
});

  document.querySelectorAll('.color-btn2').forEach((btn) => {
  btn.addEventListener('click', () => {

    document.querySelectorAll('.color-btn2')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    BotbagMeshes.forEach((mesh) => {
      if (!mesh.userData.cloned) {
        mesh.material = mesh.material.clone();
        mesh.userData.cloned = true;
      }

      mesh.material.color.set(btn.dataset.color);
    });
  });
});

// --- Resize handler ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Render loop ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
