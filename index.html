<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tent Configurator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #111; }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 16px;
      border-radius: 10px;
      color: white;
      min-width: 160px;
    }

    #ui h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.7; }

    .color-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 6px 0;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .color-btn:hover { background: rgba(255,255,255,0.15); }
    .color-btn.active { border-color: white; background: rgba(255,255,255,0.2); }

    .swatch {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    #status {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.6;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 10px;
    }
  </style>
</head>
<body>

<div id="ui">
  <h3>Tent Fly
