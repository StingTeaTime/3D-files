<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tent Configurator</title>

<style>
body { margin: 0; overflow: hidden; font-family: Arial; }
#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
}
button {
    display:block;
    margin:5px 0;
    padding:10px;
}
</style>
</head>

<body>

<div id="ui">
    <button onclick="setColor('#228B22')">Green</button>
    <button onclick="setColor('#4169E1')">Blue</button>
    <button onclick="setColor('#111111')">Black</button>
</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeeee);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(2,2,4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 2));
const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5,10,5);
scene.add(light);

let tentFly = null;

const loader = new GLTFLoader();

loader.load(
    './TentJs.glb',
    (gltf) => {

        scene.add(gltf.scene);

        gltf.scene.traverse((child) => {
            if(child.name === 'TentFly') {
                tentFly = child;
                console.log('TentFly found');
            }
        });

    }
);

window.setColor = function(color){

    if(tentFly){
        tentFly.material.color.set(color);
    } else {
        console.log("TentFly not found yet");
    }

};

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
